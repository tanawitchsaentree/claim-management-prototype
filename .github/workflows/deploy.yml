name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configure npm for Allianz Nexus
        run: |
          echo "registry=https://nexus-cluster.adp.allianz/repository/npm-public/" > .npmrc
          echo "always-auth=false" >> .npmrc

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx ng build

      - name: Copy index.html to 404.html (SPA routing fallback)
        run: cp dist/claim-management/browser/index.html dist/claim-management/browser/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/claim-management/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
