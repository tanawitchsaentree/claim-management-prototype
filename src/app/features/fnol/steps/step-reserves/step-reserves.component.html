@if (cards(); as cards) {
  <div class="step-page">
    <p class="step-breadcrumb">Claim notification</p>
    <h1 class="step-title">Reserves</h1>
    @if (cards.length > 1) {
      <p class="step-intro">
        This notification creates {{ cards.length }} claims, one for each policy. Each claim needs
        an indemnity reserve, or an explanation why there is none yet.
      </p>
    }

    <div class="claim-cards">
      @for (card of cards; track card.claim.policyNumber) {
        <app-reserve-claim-card
          [attr.data-claim-index]="card.claim.index"
          [claim]="card.claim"
          [data]="card.data"
          [flagged]="isFlagged(card)"
          (addReserve)="onAddReserve(card)"
          (editLine)="onEditLine(card, $event)"
          (removeLine)="onRemoveLine(card, $event)"
          (narrativeSaved)="onNarrativeSaved()"
        ></app-reserve-claim-card>
      }
    </div>

    <app-wizard-footer (cancelClick)="onCancel()" (back)="onBack()" (next)="onNext()">
    </app-wizard-footer>
  </div>
}
