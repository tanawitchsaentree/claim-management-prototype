<div class="app-shell">
  <app-navbar />

  @if (refSvc.isTabsMode()) {
    <app-claim-reference-tabs />
  }

  <div class="app-body">
    <app-sidebar />
    <main class="main-content">
      <router-outlet />
    </main>
    @if (showRightStrip()) {
      <app-claim-right-strip />
    }
    @if (refSvc.isPanelMode() && showRightStrip() && refSvc.refClaimId()) {
      <app-claim-reference-panel
        [claimId]="refSvc.refClaimId()!"
        (closePanel)="refSvc.close()" />
    }
  </div>
</div>
