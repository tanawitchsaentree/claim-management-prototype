<div class="crs-host">
  <div class="crs-strip" [class.crs-strip--collapsed]="collapsed">
    <div class="crs-items">
      <!-- Standard strip items -->
      @for (item of items; track item.key) {
        <button
          class="crs-btn"
          [class.crs-btn--active]="activeKey === item.key"
          (click)="activate(item.key)"
          [title]="item.label">
          <nx-icon [name]="item.icon" size="s"></nx-icon>
        </button>
      }

      <!-- References icon with badge count -->
      <button
        class="crs-btn crs-btn--ref"
        [class.crs-btn--active]="activeKey === 'references'"
        type="button"
        title="Reference claims"
        (click)="toggleRefPanel()">
        <nx-icon name="link" size="s"></nx-icon>
        @if (refTabCount() > 0) {
          <span class="crs-badge">{{ refTabCount() }}</span>
        }
      </button>
    </div>

    <div class="crs-footer">
      <button class="crs-toggle" type="button"
              (click)="toggleCollapse()"
              [title]="collapsed ? 'Expand' : 'Collapse'">
        <nx-icon [name]="collapsed ? 'chevron-right' : 'chevron-left'" size="s"></nx-icon>
      </button>
    </div>
  </div>

  <!-- Single panel slot — animates open/close only, content swaps inside without animation -->
  @if (isPanelOpen()) {
    <div class="crs-panel-slot" [class.crs-panel-slot--ref]="activeKey === 'references'" @panelSlide>
      @if (activeKey === 'comments' && currentClaimId(); as id) {
        <app-claim-notes-panel [claimId]="id" [highlightNoteId]="pendingHighlightId"></app-claim-notes-panel>
      }
      @if (activeKey === 'references') {
        <app-claim-reference-panel></app-claim-reference-panel>
      }
    </div>
  }
</div>
