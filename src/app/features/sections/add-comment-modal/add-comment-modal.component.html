<div class="acm-header">
  <h2 class="acm-title">Add comment</h2>
  <p class="acm-subtitle">{{ data.attachTo }}</p>
</div>

<div class="acm-body" [formGroup]="form">
  <nx-formfield label="Title">
    <input nxInput formControlName="title" placeholder="Optional title…" />
  </nx-formfield>

  <nx-formfield label="Category">
    <nx-dropdown formControlName="category">
      @for (cat of categories; track cat) {
        <nx-dropdown-item [value]="cat">{{ cat | titlecase }}</nx-dropdown-item>
      }
    </nx-dropdown>
    <nx-error nxFormfieldError>Required.</nx-error>
  </nx-formfield>

  <nx-formfield label="Comment">
    <textarea nxInput formControlName="body" rows="4"
              placeholder="Write your comment…"></textarea>
    <nx-error nxFormfieldError>Comment cannot be empty.</nx-error>
  </nx-formfield>
</div>

<div class="acm-footer">
  <button nxButton="secondary small" type="button" (click)="cancel()">Cancel</button>
  <button nxButton="primary small" type="button" (click)="submit()">Add comment</button>
</div>
