<div class="ase-header">
  <h2 class="ase-title">Add entity</h2>
</div>

<div class="ase-body" [formGroup]="form">

  <nx-formfield label="Section">
    <nx-dropdown formControlName="target" placeholder="Select section">
      @for (opt of targetOptions; track opt.value) {
        <nx-dropdown-item [value]="opt.value">{{ opt.label }}</nx-dropdown-item>
      }
    </nx-dropdown>
    <nx-error nxFormfieldError>Required.</nx-error>
  </nx-formfield>

  @if (damageTypeKey()) {
    <p class="ase-entity-group__title">
      {{ damageTypeLabel() }}
      @if (isNewSection()) { <span class="ase-new-badge">new section</span> }
    </p>
  }

  <nx-formfield label="Entity name">
    <input nxInput formControlName="entityName" autocomplete="off" placeholder="e.g. Kaufmann's Warehouse" />
    <nx-error nxFormfieldError>Required.</nx-error>
  </nx-formfield>

  <nx-formfield label="Instruction status">
    <nx-dropdown formControlName="instructionStatus">
      @for (opt of instructionStatusOptions; track opt) {
        <nx-dropdown-item [value]="opt">{{ opt }}</nx-dropdown-item>
      }
    </nx-dropdown>
  </nx-formfield>

</div>

<div class="ase-footer">
  <button nxButton="secondary small" type="button" (click)="cancel()">Cancel</button>
  <button nxButton="primary small" type="button" (click)="confirm()">Add entity</button>
</div>
