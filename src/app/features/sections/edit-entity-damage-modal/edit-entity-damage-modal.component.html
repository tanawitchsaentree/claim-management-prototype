<!-- Header -->
<div class="eed-header">
  <h2 class="eed-title">Edit Entity — {{ data.entity.name }}</h2>
  <button nxIconButton="tertiary small" type="button" (click)="cancel()" aria-label="Close">
    <nx-icon name="close"></nx-icon>
  </button>
</div>

<!-- Body -->
<div class="eed-body" [formGroup]="form">

  <nx-formfield label="Instruction status">
    <nx-dropdown formControlName="instructionStatus" placeholder="Select status">
      @for (opt of instructionStatusOptions; track opt) {
        <nx-dropdown-item [value]="opt">{{ opt }}</nx-dropdown-item>
      }
    </nx-dropdown>
    @if (form.get('instructionStatus')?.invalid && form.get('instructionStatus')?.touched) {
      <nx-error nxFormfieldError>Please select an instruction status</nx-error>
    }
  </nx-formfield>

</div>

<!-- Footer -->
<div class="eed-footer">
  <button nxButton="secondary small" type="button" (click)="cancel()">Cancel</button>
  <button nxButton="primary small" type="button" (click)="confirm()">Save changes</button>
</div>
