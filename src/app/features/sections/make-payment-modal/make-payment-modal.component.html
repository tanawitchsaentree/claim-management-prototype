<div class="mpm-header">
  <h2 class="mpm-title">Make payment</h2>
  <p class="mpm-subtitle">{{ data.section.name }}</p>
</div>

<div class="mpm-body" [formGroup]="form">
  <div class="mpm-row">
    <nx-formfield label="Amount" class="mpm-amount">
      <input nxInput type="number" formControlName="amount" placeholder="0.00" min="0.01" step="0.01" />
      <nx-error nxFormfieldError>Enter a valid amount.</nx-error>
    </nx-formfield>
    <nx-formfield label="Currency" class="mpm-currency">
      <nx-dropdown formControlName="currency">
        @for (c of currencies; track c) {
          <nx-dropdown-item [value]="c">{{ c }}</nx-dropdown-item>
        }
      </nx-dropdown>
    </nx-formfield>
  </div>

  <nx-formfield label="Payment type">
    <nx-dropdown formControlName="paymentType" placeholder="Select type">
      @for (t of paymentTypes; track t) {
        <nx-dropdown-item [value]="t">{{ t }}</nx-dropdown-item>
      }
    </nx-dropdown>
    <nx-error nxFormfieldError>Required.</nx-error>
  </nx-formfield>

  <nx-formfield label="Payment reference">
    <input nxInput formControlName="reference" placeholder="e.g. INV-2026-001" />
    <nx-error nxFormfieldError>Required.</nx-error>
  </nx-formfield>
</div>

<div class="mpm-footer">
  <button nxButton="secondary small" type="button" (click)="cancel()">Cancel</button>
  <button nxButton="primary small" type="button" (click)="confirm()">Submit payment</button>
</div>
