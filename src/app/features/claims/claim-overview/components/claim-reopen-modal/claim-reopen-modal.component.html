<div class="crm-header">
  <h2 class="crm-title">Reopen claim</h2>
  <button nxIconButton="tertiary small" type="button" (click)="onCancel()" aria-label="Close">
    <nx-icon name="close"></nx-icon>
  </button>
</div>

<div class="crm-body">
  <p class="crm-intro">
    Reopen <strong>{{ claim.claimId }}</strong>. Pick a reason and add an optional note for context.
  </p>

  <form [formGroup]="form" class="crm-form">
    <nx-formfield label="Reopening reason">
      <nx-dropdown formControlName="reason" placeholder="Select reason">
        @for (r of reopenReasons; track r) {
          <nx-dropdown-item [value]="r">{{ r }}</nx-dropdown-item>
        }
      </nx-dropdown>
      <nx-error nxFormfieldError>Reason is required.</nx-error>
    </nx-formfield>

    <nx-formfield label="Note (optional)">
      <textarea nxInput formControlName="note" rows="3"
                placeholder="Add context for the audit trail…"></textarea>
      <nx-hint nxFormfieldHint>Visible in the claim's activity log.</nx-hint>
    </nx-formfield>
  </form>

  @if (saveError) {
    <nx-message type="error">{{ saveError }}</nx-message>
  }
</div>

<div class="crm-footer">
  <button nxButton="secondary small" type="button" (click)="onCancel()">Cancel</button>
  <button nxButton="primary small" type="button"
          [disabled]="form.invalid || saving"
          (click)="onReopen()">
    @if (saving) { <nx-spinner size="small"></nx-spinner> }
    @else        { Reopen }
  </button>
</div>
