<div class="sim-header">
  <h2 class="sim-title">Start investigation</h2>
  <button nxIconButton="tertiary small" type="button" (click)="onCancel()" aria-label="Close">
    <nx-icon name="close"></nx-icon>
  </button>
</div>

<form [formGroup]="form" (ngSubmit)="onSubmit()" class="sim-body">
  <nx-formfield nxLabel="Assignee">
    <nx-dropdown formControlName="assignee" placeholder="Select claim handler">
      @for (h of handlers; track h.userId) {
        <nx-dropdown-item [value]="h.name">{{ h.name }}</nx-dropdown-item>
      }
    </nx-dropdown>
    <nx-error nxFormfieldError>Assignee is required.</nx-error>
  </nx-formfield>

  <nx-formfield nxLabel="Deadline">
    <input nxDatefield nxInput formControlName="deadline" [datepicker]="deadlinePicker" />
    <nx-datepicker-toggle nxFormfieldSuffix [for]="deadlinePicker"></nx-datepicker-toggle>
    <nx-datepicker #deadlinePicker></nx-datepicker>
    <span nxFormfieldHint>YYYY-MM-DD</span>
    <nx-error nxFormfieldError>Deadline is required.</nx-error>
  </nx-formfield>

  <nx-formfield nxLabel="Notes (optional)">
    <textarea nxInput formControlName="notes" rows="3"></textarea>
  </nx-formfield>
</form>

<div class="sim-footer">
  <button nxButton="secondary small" type="button" (click)="onCancel()">Cancel</button>
  <button nxButton="primary small" type="button" (click)="onSubmit()">Start</button>
</div>
