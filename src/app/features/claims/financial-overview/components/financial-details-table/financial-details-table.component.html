<!-- audit-exempt: always has the fixed Insured / Reserve / Payments / Recoveries rows -->
<table nxTable class="fo-table">
  <thead>
    <tr nxTableRow>
      <th nxHeaderCell></th>
      <th nxHeaderCell class="fo-cell--right">Gross</th>
      <th nxHeaderCell class="fo-cell--right">Gross net</th>
      <th nxHeaderCell class="fo-cell--right">Net</th>
    </tr>
  </thead>
  <tbody>
    @for (row of rows(); track row.label) {
      <tr nxTableRow>
        <td nxCell>{{ row.label }}</td>
        <td nxCell class="fo-cell--right">
          {{ row.gross | currency: currency() : 'symbol' : '1.0-0' }}
        </td>
        <td nxCell class="fo-cell--right">
          {{ row.grossNet | currency: currency() : 'symbol' : '1.0-0' }}
        </td>
        <td nxCell class="fo-cell--right">
          {{ row.net | currency: currency() : 'symbol' : '1.0-0' }}
        </td>
      </tr>
    }
  </tbody>
</table>
