<div class="lt">
  <p class="lt__count">{{ count() }} {{ count() === 1 ? 'item' : 'items' }}</p>
  @if (needsYou() > 0 || needsYouOnly()) {
    <button
      type="button"
      class="lt__needs"
      [class.lt__needs--on]="needsYouOnly()"
      [attr.aria-pressed]="needsYouOnly()"
      (click)="needsYouOnly.set(!needsYouOnly())"
    >
      Needs you: {{ needsYou() }}
      @if (needsYouOnly()) {
        <span class="lt__clear">Show all</span>
      } @else {
        <span class="lt__clear">Show only these</span>
      }
    </button>
  }
  <div class="lt__action"><ng-content></ng-content></div>
</div>
