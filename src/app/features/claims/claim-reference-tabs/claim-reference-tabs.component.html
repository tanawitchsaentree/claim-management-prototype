<!-- Tab bar strip — sits below navbar, above page content -->
<div class="rt-bar">

  <!-- Primary claim tab -->
  <button
    class="rt-tab"
    [class.rt-tab--active]="activeTab() === 'primary'"
    type="button"
    (click)="goToPrimary()">
    <nx-icon name="product-board-paper-note" size="s" class="rt-tab__icon"></nx-icon>
    <span class="rt-tab__label">{{ svc.primaryClaimId() }}</span>
  </button>

  <!-- Reference claim tab — full claim, navigates like a real browser tab -->
  @if (svc.refClaimId(); as refId) {
    <button
      class="rt-tab"
      [class.rt-tab--active]="activeTab() === 'ref'"
      type="button"
      (click)="goToRef()">
      <span class="rt-tab__badge">Ref</span>
      <span class="rt-tab__label">{{ refId }}</span>
      <button
        class="rt-tab__close"
        type="button"
        (click)="$event.stopPropagation(); closeRef()"
        aria-label="Close reference tab">
        <nx-icon name="close" size="s"></nx-icon>
      </button>
    </button>
  }

</div>
