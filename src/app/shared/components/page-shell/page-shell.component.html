<app-navbar />

@if (breadcrumb.length) {
  <div class="shell-toolbar">
    <div class="shell-toolbar__inner">
      <ol nxBreadcrumb>
        @for (item of breadcrumb; track item.label; let last = $last) {
          <li nxBreadcrumbItem>
            @if (item.route && !last) {
              <a [routerLink]="item.route">{{ item.label }}</a>
            } @else {
              {{ item.label }}
            }
          </li>
        }
      </ol>
    </div>
  </div>
}

<div class="shell-page-wrap">
  @if (toast) {
    <div nxLayout="grid maxwidth" class="shell-toast">
      <div nxRow>
        <div nxCol="12">
          <nx-message context="success" [closable]="true" (close)="toastClose.emit()">
            {{ toast }}
          </nx-message>
        </div>
      </div>
    </div>
  }

  <!-- Declared ONCE and stamped into whichever branch renders. A second
       <ng-content> in the @else branch (which is what this was until 2026-09-03)
       does not give you a second slot: Angular projects the caller's content into
       one slot only, and it was the @else one — so `align="grid"` silently
       rendered an empty grid column with no error anywhere. Found when
       loss-event-overview became the first align="grid" caller with content. -->
  <ng-template #shellContent><ng-content></ng-content></ng-template>

  @if (align === 'grid') {
    <div nxLayout="grid maxwidth" class="shell-page">
      <div nxRow>
        <div nxCol="12">
          <ng-container [ngTemplateOutlet]="shellContent"></ng-container>
        </div>
      </div>
    </div>
  } @else {
    <div class="shell-page shell-page--navbar-aligned">
      <ng-container [ngTemplateOutlet]="shellContent"></ng-container>
    </div>
  }
</div>
