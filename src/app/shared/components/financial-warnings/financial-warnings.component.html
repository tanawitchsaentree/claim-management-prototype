@if (checks().length > 0) {
  <div class="fw-list" role="region" aria-label="Things to check before you submit">
    @for (check of checks(); track check.id) {
      <nx-message [context]="context(check)" class="fw-message">
        <strong>{{ check.title }}</strong>
        <span class="fw-body">{{ check.body }}</span>
        @if (check.needsReason && reason(); as ctrl) {
          <nx-formfield label="Reason for going over the limit *" class="fw-reason">
            <input nxInput [formControl]="ctrl" />
            @if (showReasonError() && ctrl.invalid) {
              <nx-error nxFormfieldError>Give a reason to continue.</nx-error>
            }
          </nx-formfield>
        }
      </nx-message>
    }
  </div>
}
