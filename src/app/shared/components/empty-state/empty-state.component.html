<!-- One ng-content per slot: Angular projects into the FIRST ng-content that
     matches, so repeating the slots in two @if branches left [body]/[action]
     empty whenever the second (no-icon) branch rendered. -->
<div class="empty-state" [class.empty-state--icon]="!!icon" [class.empty-state--text]="!icon">
  @if (icon) {
    <nx-icon [name]="icon" class="empty-state__icon"></nx-icon>
  }
  <p class="empty-state__message">{{ message }}</p>
  @if (hint) {
    <p class="empty-state__hint">{{ hint }}</p>
  }
  <ng-content select="[body]"></ng-content>
  <ng-content select="[action]"></ng-content>
</div>
