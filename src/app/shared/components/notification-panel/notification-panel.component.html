<button
  nxIconButton="tertiary small"
  type="button"
  class="np-bell"
  [nxContextMenuTriggerFor]="menu"
  [attr.aria-label]="count() ? count() + ' notifications need you' : 'notifications'"
>
  <nx-icon name="bell-o"></nx-icon>
  @if (count() > 0) {
    <span class="np-badge" aria-hidden="true">{{ count() }}</span>
  }
</button>

<nx-context-menu #menu="nxContextMenu">
  @for (g of groups(); track g.heading) {
    <button nxContextMenuItem type="button" disabled class="np-heading"><span class="np-heading-text">{{ g.heading }}</span></button>
    @for (n of g.items; track n.id) {
      <button nxContextMenuItem type="button" (click)="open(n)">
        <span class="np-line">
          @if (n.tone === 'done') {
            <nx-icon name="check-circle" size="s" class="np-check" aria-hidden="true"></nx-icon>
          }
          <span class="np-item">{{ n.title }}</span>
          <nx-icon name="chevron-right-small" size="s" class="np-chevron" aria-hidden="true"></nx-icon>
        </span>
      </button>
    }
  } @empty {
    <button nxContextMenuItem type="button" disabled>Nothing needs you</button>
  }
</nx-context-menu>
