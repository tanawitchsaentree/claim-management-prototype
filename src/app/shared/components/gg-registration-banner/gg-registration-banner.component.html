@if (message(); as m) {
  <nx-message [context]="m.severity === 'error' ? 'error' : 'info'" class="ggb-banner">
    <strong>{{ m.title }}</strong>
    <span class="ggb-body">{{ m.body }}</span>
    @if (failureMessage(); as gg) {
      <span class="ggb-gg-message"><span class="ggb-gg-label">Message from Global Genius:</span> {{ gg }}</span>
    }
    @if (m.canSendAgain) {
      <!-- "Retry" link (colleague Figma design). nx-link + <a tabindex> as
           mass-event-card.component.html:99-106. -->
      <nx-link class="ggb-action"
        ><a tabindex="0" (click)="sendAgain()" (keydown.enter)="sendAgain()">{{
          m.sendAgainLabel
        }}</a></nx-link
      >
    }
  </nx-message>
} @else if (justReady()) {
  <nx-message context="success" class="ggb-banner" [closable]="true" (close)="justReady.set(false)">
    <strong>This claim is now set up in Global Genius.</strong>
    <span class="ggb-body">Payments and reserves can go ahead.</span>
  </nx-message>
}
